<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal | Forge Building Team</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="client-portal.css"><link rel="stylesheet" href="site-frame.css"></head>
<body class="client-page">
<header class="topbar"><div class="top-left"><button class="menu-toggle" id="toggle" type="button" aria-expanded="true" aria-controls="navigation" aria-label="Toggle navigation"><span></span><span></span><span></span></button><a href="index.html" class="home-link">Home</a></div><a href="index.html" class="logo"><img src="assets/fbt-logo.png" alt="FBT forge building team"></a></header>
<div class="body-shell"><aside class="nav" id="navigation"><nav aria-label="Main navigation"><a href="about.html">About Us</a><a href="people.html">Our People</a><a href="services.html">What We Do</a><a href="projects.html">Our Projects</a><a href="news.html">Latest News</a><a href="careers.html">Careers</a><a href="client-portal.html" class="active" aria-current="page">Client Portal</a><a href="contact.html">Contact Us</a></nav></aside>
<main class="main client-main"><form id="client-login" class="client-login" autocomplete="off"><label for="client-id">Please enter your client ID code</label><input id="client-id" type="text" inputmode="numeric" aria-describedby="login-error" required><button type="submit">Log In</button><p id="login-error" class="login-error" role="alert" hidden>Incorrect client ID code. Please try again.</p></form><section id="client-success" class="client-success" hidden><img src="assets/client-crest.png" alt="Client crest"><div><p>Congratulations! You’ve successfully accessed the FBT Client Portal.</p><p class="success-red">Remember to tell your trainer what you’ve discovered during your feedback session.</p></div></section></main></div>
<footer><div><a href="intogram.html" aria-label="FBT Intogram" title="FBT Intogram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.8" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a><a href="contact.html" aria-label="Contact Us" title="Contact Us"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="21" rx="1"/><path d="M2 3 L16 14 L30 3"/></svg></a></div></footer>
<script>document.getElementById('toggle').addEventListener('click',function(){var n=document.getElementById('navigation');var open=n.classList.toggle('open');this.setAttribute('aria-expanded',String(open));});document.getElementById('client-login').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('client-id').value.trim()==='1212'){this.hidden=true;document.getElementById('client-success').hidden=false;startClientCelebration();}else{document.getElementById('login-error').hidden=false;}});</script><script src="frame-bridge.js"></script>
<script>
function startClientCelebration(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var canvas=document.createElement('canvas');canvas.className='client-celebration';canvas.setAttribute('aria-hidden','true');
  document.body.appendChild(canvas);var ctx=canvas.getContext('2d');if(!ctx){canvas.remove();return;}
  var width,height,dpr,particles=[],start=performance.now(),last=start;
  var colors=['#ff334f','#ffd23f','#00bcd4','#7c4dff','#4caf50','#ff8a00','#ffffff'];
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<160;i++)particles.push({kind:'confetti',x:Math.random()*width,y:-Math.random()*height*.9-10,vx:(Math.random()-.5)*2.5,vy:2.3+Math.random()*3.4,spin:Math.random()*6.28,vs:(Math.random()-.5)*.15,w:5+Math.random()*7,h:7+Math.random()*9,color:colors[i%colors.length]});
  function burst(x,y){for(var j=0;j<52;j++){var a=Math.random()*Math.PI*2,s=1.7+Math.random()*5;particles.push({kind:'spark',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.010+Math.random()*.012,color:colors[Math.floor(Math.random()*colors.length)]});}}
  var bursts=[{t:250,x:.22,y:.30},{t:650,x:.77,y:.24},{t:1050,x:.49,y:.17},{t:1550,x:.83,y:.42},{t:2050,x:.16,y:.44}];
  function draw(now){var elapsed=now-start,dt=Math.min((now-last)/16.67,2);last=now;ctx.clearRect(0,0,width,height);
    while(bursts.length&&elapsed>=bursts[0].t){var b=bursts.shift();burst(width*b.x,height*b.y);}
    for(var k=particles.length-1;k>=0;k--){var p=particles[k];p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.kind==='confetti'){p.vy+=.025*dt;p.spin+=p.vs*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();if(p.y>height+30)particles.splice(k,1);}
      else{p.vy+=.045*dt;p.vx*=.991;p.vy*=.991;p.life-=p.decay*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(p.life<=0)particles.splice(k,1);}}
    if(elapsed<5400){requestAnimationFrame(draw);}else{window.removeEventListener('resize',resize);canvas.remove();}}
  requestAnimationFrame(draw);
}
</script>
</body></html>
