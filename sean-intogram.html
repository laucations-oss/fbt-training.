$('follow').onclick=()=>{following=!following;$('follow').textContent=following?'Following':'Follow';$('follow').classList.toggle('following',following);$('followers').textContent=(487+(following?1:0)).toLocaleString('en-GB');showToast(following?'You are now following seanrodgers':'Unfollowed seanrodgers')};$('message').onclick=()=>showToast('Messaging is simulated on this training website');$('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('explore').onclick=()=>document.getElementById('grid').scrollIntoView({behavior:'smooth'});$('share-profile').onclick=()=>shareLink(location.href);function shareLink(url){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(()=>showToast('Link copied')).catch(()=>showToast('Sharing is simulated on this training website'))}else{showToast('Sharing is simulated on this training website')}}$('like').onclick=()=>{liked.has(active)?liked.delete(active):liked.add(active);render()};$('save').onclick=()=>{saved.has(active)?saved.delete(active):saved.add(active);render();showToast(saved.has(active)?'Post saved':'Post removed from saved')};$('share').onclick=()=>shareLink(location.href.split('#')[0]+'#post-'+(active+1));$('close').onclick=closePost;modal.onclick=e=>{if(e.target===modal)closePost()};document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')closePost();if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){active=(active+1)%posts.length;render()}if(e.key==='ArrowLeft'){active=(active+posts.length-1)%posts.length;render()}});const match=location.hash.match(/^#post-(\d+)$/);if(match&&+match[1]>=1&&+match[1]<=posts.length)openPost(+match[1]-1);
</script><script>
// Intogram is a read-only fictional profile: opening posts is the only interaction.
['follow','message','home','explore','share-profile','like','comment-focus','share','save'].forEach(function(id){
 var old=document.getElementById(id);if(!old)return;
 var replacement=old.cloneNode(true);old.parentNode.replaceChild(replacement,old);
 replacement.style.cursor='default';replacement.setAttribute('aria-disabled','true');
});
// Story highlights are decorative on this profile.
document.querySelectorAll('.highlight').forEach(function(button){var copy=button.cloneNode(true);button.replaceWith(copy);copy.style.cursor='default';copy.setAttribute('tabindex','-1')});
</script><script src="frame-bridge.js"></script></body></html>
